<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L8,3 L0,6 Z" fill="#333333"/>
</marker>
<marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L8,3 L0,6 Z" fill="#c62828"/>
</marker>
<marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L8,3 L0,6 Z" fill="#2e7d32"/>
</marker>
<marker id="arrowNavy" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
  <path d="M0,0 L8,3 L0,6 Z" fill="#133D6E"/>
</marker>
<pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
  <line x1="0" y1="0" x2="0" y2="8" stroke="#888888" stroke-width="2"/>
</pattern>

</defs>
<rect x="0" y="0" width="900" height="340" fill="white"/>

<line x1="120" y1="110" x2="340" y2="143" stroke="#0A2546" stroke-width="2.5"/>
<line x1="120" y1="280" x2="340" y2="247" stroke="#0A2546" stroke-width="2.5"/>
<line x1="120" y1="110" x2="120" y2="280" stroke="#888888" stroke-width="2"/>
<line x1="340" y1="143" x2="340" y2="247" stroke="#888888" stroke-width="2"/>
<circle cx="120" cy="110" r="6" fill="#133D6E" stroke="white" stroke-width="1.5"/>
<circle cx="120" cy="280" r="6" fill="#133D6E" stroke="white" stroke-width="1.5"/>
<circle cx="340" cy="143" r="6" fill="#133D6E" stroke="white" stroke-width="1.5"/>
<circle cx="340" cy="247" r="6" fill="#133D6E" stroke="white" stroke-width="1.5"/>
<path d="M 123.1 149.7 A 50 50 0 0 1 123.1 240.3" fill="none" stroke="#133D6E" stroke-width="3" marker-end="url(#arrowNavy)"/>
<text x="20" y="130" font-size="13" fill="#133D6E" font-weight="600" text-anchor="start" style="">Mₓ = 23 MN·m</text>
<text x="20" y="147" font-size="11" fill="#777777" font-weight="normal" text-anchor="start" style="">(major bending)</text>
<path d="M 223.7 82.4 A 28 28 0 0 1 276.3 82.4" fill="none" stroke="#3D6FAB" stroke-width="2.5" marker-end="url(#arrowNavy)"/>
<text x="155" y="84" font-size="12.5" fill="#3D6FAB" font-weight="600" text-anchor="start" style="">Mᵧ = 2.3 MN·m</text>
<text x="155" y="101" font-size="10.5" fill="#777777" font-weight="normal" text-anchor="start" style="">(minor bending)</text>
<path d="M 266.7 204.8 A 38 38 0 1 1 266.7 185.2" fill="none" stroke="#f57c00" stroke-width="2.8" marker-end="url(#arrowRed)"/>
<circle cx="230" cy="195" r="3.5" fill="#f57c00"/>
<text x="212" y="283" font-size="13" fill="#f57c00" font-weight="600" text-anchor="middle" style="">T = 11 MN·m</text>
<text x="212" y="299" font-size="10.5" fill="#777777" font-weight="normal" text-anchor="middle" style="">(torsion, shear flow)</text>
<line x1="480" y1="25" x2="480" y2="320" stroke="#e0e0e0" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="530" y="50" font-size="14.5" fill="#133D6E" font-weight="600" text-anchor="start" style="">Why this matters</text>
<text x="530" y="76" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="start" style="">Mₓ dominates: 10× larger than Mᵧ, drives</text>
<text x="530" y="97" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="start" style="">the upper-skin compression that triggers</text>
<text x="530" y="118" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="start" style="">panel buckling under the boom-idealization</text>
<text x="530" y="139" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="start" style="">model (panels carry shear only).</text>
<text x="530" y="160" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="start" style=""></text>
<text x="530" y="181" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="start" style="">Torsion (T) is carried as shear flow around</text>
<text x="530" y="202" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="start" style="">the closed single-cell section — it adds to</text>
<text x="530" y="223" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="start" style="">the shear stress in the skin panels but does</text>
<text x="530" y="244" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="start" style="">not directly load the booms axially.</text>
<text x="530" y="265" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="start" style=""></text>
<text x="530" y="286" font-size="12.5" fill="#333333" font-weight="normal" text-anchor="start" style="">Material: Aluminum 7075-T6, E = 74 GPa</text>
</svg>